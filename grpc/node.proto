syntax = "proto3";
option go_package = "github.com/efferbach92-cmyk/Mandatory-Activity-5/grpc";

enum BidStatus {
    UNKNOWN=0;
    SUCCESS=1; 
    FAIL=2;
    AUCTION_OVER=3;
    ERROR=4; 
}

service AuctionService {
rpc Bid(BidRequest) returns (BidResponse); 
rpc Result(Empty) returns (ResultResponse);

}

message BidRequest {
    string bidder = 1;
    int32 bid = 2;
    int32 requestID = 3;
}

message BidResponse {
    BidStatus status = 1;
}

message Empty {}

message ResultResponse {
    string winner = 1;
    int32 winning_bid = 2;
    bool auction_over = 3;
}

service NodeService {
    rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
    rpc Heartbeat(HeartbeatRequest) returns (Empty);
    rpc RequestVote(VoteRequest) returns (VoteResponse);
}

message ReplicateRequest {
    int32 sequenceNumber  = 1;
    int32 requestID = 2;
    string bidder = 3;
    int32 amount = 4;
    int32 term = 5;
}

message ReplicateResponse {
    bool acknowledged = 1;
}

message HeartbeatRequest {
    int32 LeaderID = 1;
    int32 Term = 2;
}

message VoteRequest {
    int32 CandidateID = 1;
    int32 term = 2;
    int32 LastLogIndex = 3;
    int32 LastLogTerm = 4;
}

message VoteResponse {
    int32 Term = 1;
    bool VoteGranted = 2;
}